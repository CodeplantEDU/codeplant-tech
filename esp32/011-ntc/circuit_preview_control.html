<!doctype html><html lang="ko"><meta charset="utf-8"><title>NTC 분압 계산 예시</title><style>@font-face{font-family:Pretendard;src:url('/assets/Pretendard-Regular.ttf')}body{margin:0;background:#DFEAFF;font-family:Pretendard,sans-serif}main{width:1000px}svg{display:block}</style><main><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="diagram-ntc-title diagram-ntc-desc"><title id="diagram-ntc-title">NTC 저항이 줄면 접점 전압도 내려갑니다</title><desc id="diagram-ntc-desc">3.3V 전원과 고정10k 저항에서 NTC10k이면1.65V,5k이면1.10V라는 이론 계산. ADC 값이나 실측 온도는 아닙니다.</desc><g font-family="Pretendard,sans-serif" fill="#2D2D2D"><text x="40" y="50" font-size="32">접점 전압 = 3.3V × Rntc / (10kΩ + Rntc)</text><text x="40" y="105" font-size="27">전원과 저항이 정확하다고 가정한 이론값 · 실제 측정 아님</text></g><g fill="white" stroke="#315DAB" stroke-width="2"><rect x="60" y="160" width="390" height="230" rx="8"/><rect x="550" y="160" width="390" height="230" rx="8"/></g><g fill="#2D2D2D" font-family="Pretendard,sans-serif" font-size="32"><text x="100" y="225">NTC = 10kΩ</text><text x="100" y="285">접점 1.65V</text><text x="100" y="345">3.3 × 10 / 20</text><text x="590" y="225">NTC = 5kΩ</text><text x="590" y="285">접점 1.10V</text><text x="590" y="345">3.3 × 5 / 15</text></g><path d="M470 275 H530 M518 263 L530 275 L518 287" stroke="#315DAB" fill="none" stroke-width="4"/><g font-family="Pretendard,sans-serif" fill="#2D2D2D" font-size="28"><text x="60" y="455">따뜻해짐 → NTC 저항 감소 → 접점 전압 감소</text><text x="60" y="510">ADC 숫자는 보드에서 읽어 비교합니다. °C로 바꾸지 않습니다.</text></g></svg></main></html>
